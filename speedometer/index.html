<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex Speedometer</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06090e"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#06090e;--cd:#0c121b;--ln:#1a2431;--tx:#e8e8e4;--mu:#7d8b9b;--br:#c9a24b;--c:#f4f4f4}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;font-variant-numeric:tabular-nums}
body.over{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{box-shadow:inset 0 0 80px #ff3b4d40}}
@media(prefers-reduced-motion:reduce){body.over{animation:none;box-shadow:inset 0 0 50px #ff3b4d40}}
button,input{font:inherit;color:var(--tx);background:#0c121bcc;border:1px solid var(--ln);border-radius:8px;padding:6px 11px}
button{cursor:pointer;color:var(--mu)}button:hover{border-color:var(--br);color:var(--tx)}button.on{border-color:var(--br);color:var(--br)}
button:focus-visible,input:focus-visible{outline:2px solid var(--br)}
.mu{color:var(--mu)}h2{font-size:12px;font-weight:500;color:var(--mu);margin:14px 0 6px}
#app{display:grid;grid-template-columns:1.2fr 1fr;height:100vh;height:100dvh}
#mp{position:relative;overflow:hidden;background:#0a0d12}
#map{position:absolute;inset:0;filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(1.05) saturate(.55)}
#mp::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#06090e,#06090e00 30%),linear-gradient(90deg,#0000 82%,#06090e)}
#mapmsg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:4;color:var(--mu);text-align:center;padding:0 16px}
#car{position:absolute;left:50%;top:72%;height:min(20vh,100px);transform:translate(-50%,-50%);z-index:3;filter:drop-shadow(0 6px 8px #000a)}
#srch{position:absolute;left:10px;top:10px;width:min(46%,270px);z-index:6}
#srch input{width:100%;background:#0c121bee}
#sugs{display:grid;margin-top:4px}#sugs button,#sugs div{text-align:left;border-radius:0;border-top:0;background:#0c121bf2;padding:8px 11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--tx)}
#nav{position:absolute;left:10px;top:54px;display:flex;gap:10px;align-items:center;background:#0c121bee;border:1px solid var(--ln);border-radius:12px;padding:8px 10px;z-index:5;max-width:min(52%,300px)}
#nav[hidden]{display:none}#na{font-size:30px;color:var(--br);width:36px;text-align:center}#nd{font-size:20px}#nt{font-size:12px}
#eta{position:absolute;left:10px;bottom:10px;z-index:5;color:var(--tx);background:#0c121bdd;border-radius:8px;padding:6px 10px}#eta:empty{display:none}
#attr{position:absolute;right:6px;bottom:3px;font-size:9px;color:#8b95a1;z-index:5}
#dp{display:grid;place-items:center;padding:6px}
#g{width:min(100%,calc(100vh - 28px));height:auto;aspect-ratio:1}
#rd{position:fixed;top:2px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:7;text-shadow:0 2px 12px #000}
#sp1{font-size:min(15vh,76px);font-weight:300;line-height:1;color:var(--c)}#sf{font-size:.38em;opacity:.7}
#ul{color:var(--mu);font-size:12px;letter-spacing:.14em}#unc{font-size:11px}
.gl{display:flex;justify-content:center;gap:8px;align-items:baseline;color:var(--mu);font-size:12px;margin-top:3px}#gn{font-size:20px;color:var(--br)}
body.hud #g,body.hud #rd{transform:scaleX(-1)}body.hud #rd{transform:translateX(-50%) scaleX(-1)}
#bar{position:fixed;right:8px;bottom:8px;display:flex;gap:6px;align-items:center;z-index:8}
.pill{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:12px}.pill i{width:8px;height:8px;border-radius:50%;background:#444}
.pill.g i{background:#3ddbb0}.pill.y i{background:#ffb454}.pill.r i{background:#ff5d6c}
.dg{position:fixed;left:8px;right:8px;bottom:44px;z-index:9;border:1px solid #5a3a1a;background:#1a120aee;border-radius:10px;padding:9px 12px;color:#e8cf9c;font-size:13px;line-height:1.4}.dg[hidden]{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.t{border:1px solid var(--ln);border-radius:10px;padding:8px 10px;background:var(--cd)}.t small{color:var(--mu);display:block;margin-bottom:2px;font-size:12px}.t b{font-size:16px;font-weight:500}
.eb{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.gr{display:flex;align-items:center;gap:8px;margin:6px 0}.gr b{width:14px;text-align:center;color:var(--mu)}.gr.a b{color:var(--br)}
.tr{position:relative;flex:1;height:10px;background:#0b1118;border-radius:5px;overflow:hidden}.tr i{position:absolute;top:0;bottom:0;border-radius:5px}.u{background:#1e2c40}.s{background:#8a6a28}.gr.a .s{background:var(--br)}
.mk{position:absolute;top:-1px;bottom:-1px;width:2px;background:#fff;box-shadow:0 0 6px #fff}
dialog{background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:18px;max-width:560px;width:92vw;max-height:90vh;overflow:auto}dialog::backdrop{background:#000a}
dialog label{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;margin:7px 0}dialog label input[type=checkbox]{justify-self:start}
@media(orientation:portrait){#app{grid-template-columns:1fr;grid-template-rows:46% 1fr}#g{width:min(100%,50vh)}#rd{top:46%;transform:translate(-50%,-100%)}}
</style></head><body><body>
<div id="app">
<section id="mp"><div id="map"></div><div id="mapmsg"></div>
<svg id="car" viewBox="0 0 60 110"><defs><linearGradient id="cb" x1="0" x2="1"><stop offset="0" stop-color="#252b32"/><stop offset=".5" stop-color="#58616b"/><stop offset="1" stop-color="#252b32"/></linearGradient></defs>
<rect x="6" y="6" width="48" height="98" rx="20" fill="url(#cb)" stroke="#a7b0ba" stroke-width="1"/><path d="M13 38Q30 30 47 38L45 58Q30 53 15 58Z" fill="#0a1017"/><rect x="14" y="62" width="32" height="26" rx="8" fill="#171d24"/><path d="M13 94Q30 100 47 94" stroke="#ff4d5a" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
<div id="srch"><input id="dest" placeholder="Where are you going?" autocomplete="off"><div id="sugs"></div></div>
<div id="nav" hidden><b id="na">⬆</b><div><div id="nd"></div><div id="nt" class="mu"></div></div><button id="nx" aria-label="Cancel route">✕</button></div>
<div id="eta"></div><div id="attr">© OpenStreetMap · OpenFreeMap</div></section>
<section id="dp"><canvas id="g"></canvas></section></div>
<div id="rd"><div id="sp1"><span id="si">0</span><span id="sf">.0</span></div><div id="ul">KM/H</div><div id="unc" class="mu"></div>
<div class="gl"><span>Gear</span><b id="gn">N</b><span id="gwhy">Stationary</span></div></div>
<div id="bar"><div class="pill" id="gps"><i></i><span id="gpst">GPS off</span></div><span class="mu" style="font-size:11px">build 4</span><button id="bStart">Start</button><button id="bTrip">Trip</button><button id="bSet">Settings</button></div>
<div class="dg" id="diag" hidden role="alert"></div>
<dialog id="trip"><form method="dialog"><div class="tiles" id="tiles"></div><div class="tiles" id="more" style="margin-top:8px"></div>
<h2>Best speed for each gear (bright = power band, dim = usable)</h2><div id="gmap"></div><h2>GPS check</h2><div id="gchk" class="mu"></div><h2>Last 90 seconds</h2><canvas id="sk" height="64" style="width:100%"></canvas>
<div class="eb"><button type="button" id="bUnit">km/h</button><button type="button" id="bDemo">Demo</button><button type="button" id="bHud">HUD mirror</button><button type="button" id="bFs">Fullscreen</button><button type="button" id="bReset">Reset trip</button><button>Close</button></div></form></dialog>
<dialog id="dlg"><h2>Car &amp; display settings</h2><form method="dialog" id="fm"></form></dialog>
<script>
const $=i=>document.getElementById(i);
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const S=Object.assign({mph:false,limit:120,max:200,tw:195,ta:65,rim:15,fd:4.1,gears:'3.58,2.04,1.35,0.97,0.76',idle:800,red:6500,eco:2000,peak:5000,beep:true},ld('apex.cfg'));
let REC=ld('apex.rec').v||0,KV,DV,UL,DL,C,G;
const fresh=()=>({est:0,a:0,dem:0,fl:0,lt:0,dist:0,tt:0,tm:0,max:0,g:0,gT:0,alt:null,hd:null,acc:null,prev:null,hist:[],tz:{s:'arm',t:0,r:null},P:4,still:true,anc:null,sc:0,mc:0,rej:0,src:'–',buf:[]});
let st=fresh(),dest=null,watch=null,sim=null,ac=null,lastBeep=0;
function units(){KV=S.mph?2.236936:3.6;DV=S.mph?1/1609.344:.001;UL=S.mph?'mph':'km/h';DL=S.mph?'mi':'km';
 C=Math.PI*(S.rim*25.4+2*S.tw*S.ta/100)/1000;G=S.gears.split(',').map(Number).filter(x=>x>0);
 $('ul').textContent=UL.toUpperCase();$('bUnit').textContent=UL;buildMap();buildBg();}
const rpm=(v,i)=>v/C*60*G[i]*S.fd;
/* ---------- GPS pipeline ---------- */
function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,
 h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
/* ================= PRECISION ENGINE =================
 1 Quality gate   fixes worse than maxAcc metres are ignored
 2 Source model   chip Doppler speed is trusted; speed derived from positions is only used when the
                  movement is larger than the position error over a 5 s baseline (stops GPS drift looking like speed)
 3 Zero-velocity lock  once stopped (3 quiet fixes) speed is held at exactly 0 until real movement is confirmed
 4 Kalman filter  gain adapts to signal quality: poor signal = smoother, good signal = no lag
 5 Outlier guard  a jump over 12 m/s in one second is distrusted
 6 Distance       trapezoid integration of filtered speed, never while locked                     */
const E={maxAcc:60,stopIn:.55,goOut:1.1,q:4,jump:12};
function feed(v,acc,t,hd,alt,lat,lon){
 acc=acc||99;const dt=st.lt?t-st.lt:0;
 if(st.lt&&dt<=0)return;
 st.acc=acc;if(acc>E.maxAcc){st.rej++;return}
 const hasD=v!=null&&!isNaN(v);let m,sig,src;
 if(lat!=null)st.buf.push({lat,lon,t,acc});
 while(st.buf.length>2&&t-st.buf[0].t>5)st.buf.shift();
 if(hasD){m=Math.max(0,v);sig=Math.max(.25,acc/25);src='Doppler'}
 else if(lat!=null&&st.buf.length>1){const o=st.buf[0],d=hav(o,{lat,lon}),w=t-o.t;
  m=w>1&&d>2*Math.max(acc,o.acc)?d/w:0;sig=Math.max(1,acc*1.4/Math.max(w,1));src='derived'}
 else{m=0;sig=3;src='none'}
 if(m<E.stopIn){st.sc++;st.mc=0}else if(m>=E.goOut){st.mc++;st.sc=0}
 if(!st.still&&st.sc>=3&&st.est<2.5){st.still=true;st.anc=null}
 if(st.still&&!st.anc&&lat!=null)st.anc={lat,lon,n:1};
 else if(st.still){
  const away=st.anc&&lat!=null?hav(st.anc,{lat,lon}):0;
  const go=src==='Doppler'?((m>=3&&acc<=20)||(st.mc>=2&&away>acc)||st.mc>=4):(st.mc>=5&&away>2.5*acc);
  if(go){st.still=false;st.anc=null}}
 const p0=st.est;
 if(st.still){st.est=0;st.a=0;st.P=.04;
  if(st.anc&&lat!=null){const a=st.anc,n=Math.min(a.n+1,30);a.lat+=(lat-a.lat)/n;a.lon+=(lon-a.lon)/n;a.n=n}}
 else if(dt>0&&dt<8){
  if(Math.abs(m-st.est)>E.jump)sig*=6;
  st.P+=E.q*dt;const K=st.P/(st.P+sig*sig);st.est+=K*(m-st.est);st.P*=1-K;
  st.a+=((st.est-p0)/dt-st.a)*.45}
 else{st.est=m;st.P=sig*sig;st.a=0}
 if(dt>0&&dt<8){st.tt+=dt;if(!st.still&&st.est>1){st.dist+=.5*(st.est+p0)*dt;st.tm+=dt}}
 st.lt=t;st.fl=performance.now();st.src=src;if(lat!=null)st.pos=st.still&&st.anc?{lat:st.anc.lat,lon:st.anc.lon}:{lat,lon};
 if(hd!=null&&!isNaN(hd)&&st.est>1)st.hd=hd;if(alt!=null)st.alt=alt;
 if(!st.still&&st.mc>=2){if(st.est>st.max)st.max=st.est;if(st.est>REC)REC=st.est}
 const z=st.tz,TV=S.mph?26.8224:27.7778;
 if(z.s==='arm'&&st.est>.8){z.s='run';z.t=t}
 else if(z.s==='run'){if(st.est<.8)z.s='arm';else if(st.est>=TV){z.s='done';z.r=t-z.t}}
 else if(z.s==='done'&&st.est<.8)z.s='arm';
 pick();
}
const GC={nf:0,nul:0,src:'–',perm:'?'};
const FILEMSG='<b>This page is open as a file.</b> Chrome often blocks GPS for files. Host it over https (or run it from localhost) and GPS will work.';
function diag(t){const d=$('diag');d.hidden=!t;d.innerHTML=t||''}
function preflight(){
 if(location.protocol==='file:'||!isSecureContext)diag(FILEMSG);
 try{navigator.permissions.query({name:'geolocation'}).then(p=>{GC.perm=p.state;if(p.state==='denied')diag('<b>Location is blocked for this page.</b> Tap the lock icon by the address, open Permissions, set Location to Allow, then reload.');p.onchange=()=>{GC.perm=p.state}})}catch(e){}
}
function onPos(p){const c=p.coords;GC.nf++;GC.src=c.speed==null?'position only (no speed)':'GPS chip';
 if(c.speed==null)GC.nul++;else GC.nul=0;
 if(c.speed!=null&&c.accuracy<=50)diag('');
 else if(GC.nul>=6&&c.accuracy>30)diag('<b>Getting a position but no speed.</b> That usually means a laptop or Wi-Fi location. Use a phone with real GPS, outdoors, with Location on high accuracy.');
 feed(c.speed,c.accuracy,p.timestamp/1000,c.heading,c.altitude,c.latitude,c.longitude)}
function onErr(e){const f=location.protocol==='file:'?FILEMSG+'<br>':'';
 setGps('r',['','Location blocked','No location signal','Waiting for GPS…'][e.code]||'GPS error');
 if(e.code===1)diag(f+'<b>Location is blocked.</b> Allow it in Chrome (lock icon by the address, Permissions, Location) and make sure Location is on in your phone settings.');
 else if(e.code===2)diag(f+'<b>No location signal.</b> Turn Location on with high accuracy, then go outdoors or next to a window.');
 else setGps('y','Waiting for GPS lock…')}
function setGps(c,t){$('gps').className='pill '+c;$('gpst').textContent=t}
function start(){
 if(!ac)try{ac=new AudioContext()}catch(e){}
 if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null;$('bStart').textContent='Start';$('bStart').classList.remove('on');setGps('','GPS off');return}
 if(!navigator.geolocation){setGps('r','No geolocation in this browser');return}
 stopSim();setGps('y','Searching for GPS…');preflight();
 watch=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
 $('bStart').textContent='Stop';$('bStart').classList.add('on');
 try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}
}
function stopSim(){if(sim){clearInterval(sim);sim=null;$('bDemo').classList.remove('on')}}
function demo(){
 if(sim){stopSim();return}
 if(watch!=null)start();let t0=Date.now();$('bDemo').classList.add('on');setGps('g','Demo ±3 m');
 sim=setInterval(()=>{const s=(Date.now()-t0)/1000,v=Math.max(0,16+15*Math.sin(s/9-1.57)+Math.sin(s*1.7)*.6);
  feed(v+(Math.random()-.5)*.15,3,Date.now()/1000,(s*6)%360,1250+s%40);},250);
}
/* ---------- gear intelligence ---------- */
function pick(){
 let v=st.est;const now=performance.now();let why;
 if(v<0.6){st.g=0;st.why='Stationary — ready in 1st';st.n='N';return}
 st.dem+=(Math.min(1,Math.max(0,st.a/2.2))-st.dem)*0.25;
 let tgt=S.eco+(S.peak-S.eco)*Math.pow(st.dem,.8);
 if(st.a<-1.2){tgt=S.eco*1.15;why='Slowing — engine braking'}
 else if(st.dem>.35)why='Accelerating — holding revs for power';
 else why=st.dem>.08?'Gentle acceleration — balanced':'Cruising — economy zone';
 if(NAV&&NAV.next){const vt=turnSpd(NAV.next);if(vt&&v>vt&&NAV.nd<(v*v-vt*vt)/4+40){v=vt;why='Turn ahead: slow down, lower gear'}}
 let best=-1,bc=1e9;
 G.forEach((_,i)=>{const r=rpm(v,i);let c;
  if(r<Math.max(S.idle*1.25,1100)||r>S.red*.94)c=1e6;
  else{c=((r-tgt)/1000)**2;if(r<1500)c+=1.5*(1500-r)/500;if(r>S.red*.85)c+=2}
  if(i===st.g)c-=(now-st.gT<1800?1.3:.35); // hysteresis: no flicker between gears
  if(c<bc){bc=c;best=i}});
 if(best<0)best=0;if(best!==st.g){st.g=best;st.gT=now}
 st.why=why;st.n=String(best+1);
}
function buildMap(){const m=$('gmap');m.innerHTML='';
 G.forEach((g,i)=>{const f=r=>r/60*C/(g*S.fd)*KV,P=x=>Math.min(100,x/S.max*100),
  u0=f(Math.max(S.idle*1.25,1100)),u1=f(S.red*.94),a=f(Math.max(1500,S.idle*1.8)),b=f(Math.min(S.peak,S.red*.92));
  m.insertAdjacentHTML('beforeend',`<div class="gr" id="gr${i}"><b>${i+1}</b><div class="tr"><i class="u" style="left:${P(u0)}%;width:${Math.max(0,P(u1)-P(u0))}%"></i><i class="s" style="left:${P(a)}%;width:${Math.max(0,P(b)-P(a))}%"></i><u class="mk"></u></div></div>`)})}
/* ---------- drawing ---------- */
const hue=f=>'hsl('+((165-Math.min(1,Math.max(0,(f-.5)/.55))*170+360)%360)+',80%,60%)';
function resize(){if(!$('g'))return;const c=$('g'),d=devicePixelRatio||1,w=c.clientWidth;c.width=c.height=Math.round(w*d);const k=$('sk');k.width=Math.round(k.clientWidth*d);k.height=Math.round(64*d);buildBg()}
let bg=null;
function buildBg(){
 const W=$('g').width;if(!W)return;bg=document.createElement('canvas');bg.width=bg.height=W;
 const x=bg.getContext('2d'),c=W/2,T=Math.PI*2,a0=.75*Math.PI,sw=1.5*Math.PI,an=f=>a0+sw*f;
 const o0=a0-.16*Math.PI,o1=a0+sw+.16*Math.PI;x.lineCap='round';
 x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=W*.022;x.beginPath();x.arc(c,c,W*.485,o0,o1);x.stroke();
 const g=x.createConicGradient(0,c,c);['#eef2f5','#6c757d','#cfd6dc','#555d65','#eef2f5'].forEach((q,i,a)=>g.addColorStop(i/(a.length-1),q));
 x.strokeStyle=g;x.lineWidth=W*.007;x.beginPath();x.arc(c,c,W*.485,o0,o1);x.stroke();
 let r=x.createRadialGradient(c,c,0,c,c,W*.45);r.addColorStop(0,'#12171e');r.addColorStop(1,'#04060a');
 x.fillStyle=r;x.beginPath();x.arc(c,c,W*.452,0,T);x.fill();x.strokeStyle='#232a32';x.lineWidth=W*.008;x.stroke();
 const s=S.max<=100?10:S.max<=240?20:40;x.textAlign='center';x.textBaseline='middle';x.font='600 '+(W*.06)+'px "Segoe UI",Arial,sans-serif';
 for(let k=0,v=0;v<=S.max+.01;k++,v=k*s/4){const a=an(v/S.max),M=k%4===0,H=k%2===0,r1=W*.43,r2=r1-W*(M?.06:H?.04:.025),red=v>S.limit;
  x.strokeStyle=red?'#ff5d6c':M?'#f2f2f2':'#8b949e';x.lineWidth=M?W*.006:W*.003;x.beginPath();x.moveTo(c+r1*Math.cos(a),c+r1*Math.sin(a));x.lineTo(c+r2*Math.cos(a),c+r2*Math.sin(a));x.stroke();
  if(M){x.fillStyle=red?'#ff5d6c':'#f2f2f2';const q=W*.335;x.fillText(Math.round(v),c+q*Math.cos(a),c+q*Math.sin(a))}}
 x.fillStyle='#8b949e';x.font=(W*.03)+'px "Segoe UI",Arial,sans-serif';x.fillText(UL.toLowerCase(),c,c-.2*W);
}
function gauge(u){
 const cv=$('g'),W=cv.width;if(!bg||bg.width!==W)buildBg();if(!bg)return;
 const x=cv.getContext('2d'),c=W/2,T=Math.PI*2,f=Math.min(1.03,u/S.max),a=.75*Math.PI+1.5*Math.PI*f,col=u/S.limit<.85?'#f4f4f4':hue(u/S.limit);
 x.clearRect(0,0,W,W);x.drawImage(bg,0,0);
 x.save();x.translate(c,c);x.rotate(a);x.strokeStyle=col;x.shadowColor=col;x.shadowBlur=W*.014;x.lineCap='round';x.lineWidth=W*.0065;x.beginPath();x.moveTo(-W*.07,0);x.lineTo(W*.405,0);x.stroke();x.restore();
 x.fillStyle='#0a0d11';x.strokeStyle='#454d57';x.lineWidth=W*.004;x.beginPath();x.arc(c,c,W*.028,0,T);x.fill();x.stroke();
 x.fillStyle='#8b949e';x.font=(W*.034)+'px "Segoe UI",Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText((st.dist*DV).toFixed(1)+' '+DL,c,c+W*.2);
}
function spark(){const k=$('sk'),x=k.getContext('2d'),w=k.width,h=k.height,H=st.hist;x.clearRect(0,0,w,h);if(H.length<2)return;
 const m=Math.max(10,...H);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--c')||'#3ddbb0';x.strokeStyle=hue(H[H.length-1]*KV/S.limit);x.lineWidth=2;x.beginPath();
 H.forEach((v,i)=>{const px=i/(89)*w,py=h-4-(v/m)*(h-8);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
/* ---------- render loop (60 fps, predictive, no perceptible lag) ---------- */
let last=performance.now(),disp=0,lastT='';
function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;
 const raw=(t-st.fl)/1000,age=Math.min(raw,1.2),fd=raw>4?Math.max(0,1-(raw-4)/4):1,tg=st.still?0:Math.max(0,(st.est+st.a*age*.6)*fd);
 disp+=(tg-disp)*(1-Math.exp(-dt*16));if(disp<.01&&tg===0)disp=0;
 const u=disp*KV,s=u.toFixed(1);gauge(u);camUpdate(t,dt);
 if(s!==lastT){lastT=s;const p=s.split('.');$('si').textContent=p[0];$('sf').textContent='.'+p[1]}
 document.documentElement.style.setProperty('--c',hue(u/S.limit));
 const over=u>S.limit;document.body.classList.toggle('over',over);
 if(over&&S.beep&&ac&&t-lastBeep>2500){lastBeep=t;try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18)}catch(e){}}
 requestAnimationFrame(loop)}
/* ---------- panels (4 Hz) ---------- */
const TL=[['top','Top speed'],['avm','Avg moving'],['dist','Distance'],['tt','Trip time'],['rec','All-time record'],['ava','Avg overall'],['tm','Moving time'],['acc','Acceleration'],['alt','Altitude'],['hd','Heading'],['zero','0-100']];
const tl=a=>`<div class="t"><small id="${a[0]}l">${a[1]}</small><b id="${a[0]}">–</b></div>`;
$('tiles').innerHTML=TL.slice(0,4).map(tl).join('');$('more').innerHTML=TL.slice(4).map(tl).join('');
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const sp=(v,d=1)=>(v*KV).toFixed(d);
function panels(){
 const age=(performance.now()-st.fl)/1000;$('unc').textContent=!st.fl?'':st.still?'stationary · locked at 0':'± '+(Math.sqrt(st.P)*KV).toFixed(1)+' '+UL;$('gchk').textContent=location.protocol.replace(':','')+' · '+(isSecureContext?'secure':'NOT secure')+' · permission '+GC.perm+' · fixes '+GC.nf+' · speed from '+GC.src+(st.still?' · stationary lock':' · moving')+' · rejected '+st.rej+(st.acc!=null?' · ±'+Math.round(st.acc)+' m':'');
 if(watch!=null){if(!st.fl)setGps('y','Searching for GPS…');else if(age>5)setGps('r','Signal lost ('+Math.round(age)+' s)');
  else{const a=st.acc;setGps(a<=10?'g':a<=25?'y':'r','GPS ±'+Math.round(a)+' m'+(a<=10?' · excellent':a<=25?' · good':' · weak'))}}
 $('top').textContent=sp(st.max)+' '+UL;$('rec').textContent=sp(REC)+' '+UL;
 $('avm').textContent=st.tm>2?sp(st.dist/st.tm)+' '+UL:'–';$('ava').textContent=st.tt>2?sp(st.dist/st.tt)+' '+UL:'–';
 $('dist').textContent=(st.dist*DV).toFixed(st.dist*DV<10?3:2)+' '+DL;$('tt').textContent=hms(st.tt);$('tm').textContent=hms(st.tm);
 $('acc').textContent=(st.a>=0?'+':'')+st.a.toFixed(1)+' m/s² · '+(st.a/9.81).toFixed(2)+' g';
 $('alt').textContent=st.alt!=null?Math.round(st.alt)+' m':'–';
 $('hd').textContent=st.hd!=null?Math.round(st.hd)+'° '+['N','NE','E','SE','S','SW','W','NW'][Math.round(st.hd/45)%8]:'–';
 const z=st.tz;$('zerol').textContent='0–'+(S.mph?'60 mph':'100 km/h');$('zero').textContent=z.r!=null?z.r.toFixed(2)+' s':z.s==='run'?'running…':'ready';
 $('gn').textContent=st.n||'N';$('gwhy').textContent=st.why||'Stationary';
 G.forEach((_,i)=>{const e=$('gr'+i);if(!e)return;e.classList.toggle('a',st.est>.6&&i===st.g);e.querySelector('.mk').style.left=Math.min(100,disp*KV/S.max*100)+'%'});
 navTick();navUI();
}
setInterval(panels,250);
setInterval(()=>{if(watch!=null||sim){st.hist.push(st.est);if(st.hist.length>90)st.hist.shift();spark()}sv('apex.rec',{v:REC})},1000);
/* ---------- controls & settings ---------- */
$('bStart').onclick=start;$('bDemo').onclick=demo;
$('bUnit').onclick=()=>{const o=S.mph;S.mph=!S.mph;const k=S.mph?.621371:1/.621371;S.limit=Math.round(S.limit*k);S.max=Math.round(S.max*k/10)*10;sv('apex.cfg',S);units();};
$('bHud').onclick=e=>{document.body.classList.toggle('hud');e.target.classList.toggle('on')};
$('bFs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
$('bReset').onclick=()=>{const k=st.est,l=st.lt,f=st.fl,a=st.a;st=Object.assign(fresh(),{est:k,lt:l,fl:f,a,still:k<.6});st.max=k;dest=null};

const FL=[['mph','Use miles (mph)','checkbox'],['limit','Speed alert / red zone (display unit)','number'],['max','Gauge maximum','number'],['tw','Tire width (mm)','number'],['ta','Tire aspect (%)','number'],['rim','Rim size (in)','number'],['fd','Final drive ratio','number'],['gears','Gear ratios (comma separated)','text'],['idle','Idle rpm','number'],['red','Redline rpm','number'],['eco','Economy cruise rpm','number'],['peak','Peak power rpm','number'],['beep','Beep when over the alert','checkbox']];
$('fm').innerHTML=FL.map(f=>`<label>${f[1]}<input name="${f[0]}" type="${f[2]}" step="any"></label>`).join('')+'<div class="eta" style="margin-top:12px;justify-content:flex-end"><button value="x">Cancel</button><button value="ok" id="ok">Save</button></div>';
$('bSet').onclick=()=>{FL.forEach(f=>{const e=$('fm').elements[f[0]];f[2]==='checkbox'?e.checked=S[f[0]]:e.value=S[f[0]]});$('dlg').showModal()};
$('dlg').onclose=()=>{if($('dlg').returnValue!=='ok')return;FL.forEach(f=>{const e=$('fm').elements[f[0]];S[f[0]]=f[2]==='checkbox'?e.checked:f[2]==='number'?(parseFloat(e.value)||S[f[0]]):e.value});
 sv('apex.cfg',S);units()};
if(location.protocol==='file:')diag(FILEMSG);if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!window.__r){window.__r=1;location.reload()}});/* ---------- online side: map, route, turns (needs internet; the speedometer never does) ---------- */
let MAP=null,mapReady=false,NAV=null,lastRR=0,cam={t:0,init:0};
const ARW={'left':'⬅','right':'➡','slight left':'↖','slight right':'↗','sharp left':'↰','sharp right':'↱','uturn':'↶','straight':'⬆'};
const fd=m=>S.mph?(m>=160?(m/1609.344).toFixed(1)+' mi':Math.round(m*3.281/10)*10+' ft'):(m>=1000?(m/1000).toFixed(1)+' km':Math.round(m/10)*10+' m');
function mapMsg(t,ms){const e=$('mapmsg');e.textContent=t||'';if(ms)setTimeout(()=>{if(e.textContent===t)e.textContent=''},ms)}
function loadMap(){
 if(MAP||!navigator.onLine)return;
 const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css';document.head.appendChild(l);
 const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js';sc.onload=initMap;sc.onerror=()=>mapMsg('Map could not load');document.head.appendChild(sc);
}
function initMap(){
 MAP=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[0,20],zoom:1.5,pitch:0,interactive:false,attributionControl:false,fadeDuration:0});
 MAP.on('load',()=>{mapReady=true;MAP.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  const lay={'line-cap':'round','line-join':'round'};
  MAP.addLayer({id:'rc',type:'line',source:'route',layout:lay,paint:{'line-color':'#040608','line-width':15}});
  MAP.addLayer({id:'rl',type:'line',source:'route',layout:lay,paint:{'line-color':'#9a7014','line-width':8}});
  mapMsg(st.pos?'':'Waiting for GPS…')});
}
function camUpdate(now,dt){
 if(!mapReady||!st.pos||now-cam.t<33)return;cam.t=now;
 const age=Math.min((now-st.fl)/1000,2),v=st.still?0:st.est,hd=(st.hd||0)*Math.PI/180,d=v*age;
 const la=st.pos.lat+d*Math.cos(hd)/111320,lo=st.pos.lon+d*Math.sin(hd)/(111320*Math.cos(st.pos.lat*Math.PI/180));
 if(!cam.init){cam.lat=la;cam.lon=lo;cam.hd=st.hd||0;cam.init=1;mapMsg('')}
 const k=1-Math.exp(-dt*6);cam.lat+=(la-cam.lat)*k;cam.lon+=(lo-cam.lon)*k;
 cam.hd+=((((st.hd||0)-cam.hd+540)%360)-180)*(1-Math.exp(-dt*3));
 MAP.jumpTo({center:[cam.lon,cam.lat],bearing:cam.hd,pitch:60,zoom:17.2-Math.min(1.3,v/22),padding:{top:$('map').clientHeight*.42}});
}
async function search(q){q=q.trim();if(!q)return;
 try{const p=st.pos,u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(q)+(p?'&viewbox='+[p.lon-1,p.lat+1,p.lon+1,p.lat-1].join(','):'');
  const r=await(await fetch(u)).json(),d=$('sugs');d.innerHTML=r.length?'':'<div>No results</div>';
  r.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x.display_name.split(',').slice(0,3).join(',');b.onclick=()=>{d.innerHTML='';$('dest').value='';routeTo(+x.lat,+x.lon,b.textContent)};d.appendChild(b)})}
 catch(e){mapMsg('Search needs an internet connection',4000)}}
async function routeTo(la,lo,name){
 if(!st.pos){mapMsg('Waiting for GPS before starting the route',4000);return}
 try{const p=st.pos,j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${p.lon},${p.lat};${lo},${la}?overview=full&geometries=geojson&steps=true`)).json();
  if(!j.routes||!j.routes[0])throw 0;setRoute(j.routes[0],la,lo,name)}catch(e){mapMsg('Could not find a route',4000)}}
function setRoute(rt,la,lo,name){
 const g=rt.geometry.coordinates,cum=[0],steps=[];let from=0;
 for(let i=1;i<g.length;i++)cum.push(cum[i-1]+hav({lat:g[i-1][1],lon:g[i-1][0]},{lat:g[i][1],lon:g[i][0]}));
 rt.legs.forEach(l=>l.steps.forEach(q=>{const m=q.maneuver.location;let bi=from,bd=1e9;
  for(let i=from;i<g.length;i++){const d=hav({lat:m[1],lon:m[0]},{lat:g[i][1],lon:g[i][0]});if(d<bd){bd=d;bi=i}else if(d>bd+400)break}
  from=bi;steps.push({at:cum[bi],type:q.maneuver.type,mod:q.maneuver.modifier||'',name:q.name||''})}));
 NAV={g,cum,steps,total:cum[cum.length-1],dur:rt.duration||1,la,lo,name,i:0,rem:cum[cum.length-1],nd:0};
 if(mapReady)MAP.getSource('route').setData({type:'Feature',geometry:rt.geometry});navTick();navUI();
}
function navTick(){
 if(!NAV||!st.pos)return;const p=st.pos;let bi=NAV.i,bd=1e9;
 for(let i=NAV.i;i<Math.min(NAV.g.length,NAV.i+80);i++){const d=hav(p,{lat:NAV.g[i][1],lon:NAV.g[i][0]});if(d<bd){bd=d;bi=i}}
 NAV.i=bi;const prog=NAV.cum[bi];NAV.rem=NAV.total-prog;
 NAV.next=NAV.steps.find(q=>q.at>prog+8&&q.type!=='depart');NAV.nd=NAV.next?NAV.next.at-prog:NAV.rem;
 if(bd>80&&Date.now()-lastRR>15000&&!st.still){lastRR=Date.now();routeTo(NAV.la,NAV.lo,NAV.name)}
}
function navUI(){const n=NAV;$('nav').hidden=!n;if(!n){$('eta').textContent='';return}
 const x=n.next;
 if(n.rem<25){$('na').textContent='⚑';$('nd').textContent='You have arrived';$('nt').textContent=n.name;$('eta').textContent='';return}
 $('na').textContent=x?(x.type==='arrive'?'⚑':ARW[x.mod]||'⬆'):'⬆';$('nd').textContent=fd(n.nd);
 $('nt').textContent=x?(({turn:'Turn',roundabout:'Roundabout','end of road':'Turn',fork:'Keep',merge:'Merge',arrive:'Arrive'})[x.type]||'Continue')+(x.mod&&x.type!=='roundabout'&&x.type!=='arrive'?' '+x.mod:'')+(x.name?' onto '+x.name:''):'Continue';
 const vr=n.total/n.dur,vu=st.tm>60?st.dist/st.tm:vr,sec=n.rem/Math.max(3,.5*vr+.5*vu);
 $('eta').textContent=hms(sec)+' · '+(n.rem*DV).toFixed(1)+' '+DL+' · arrive '+new Date(Date.now()+sec*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
const turnSpd=q=>/sharp|uturn/.test(q.mod)?4:q.type==='roundabout'?8:(q.mod==='left'||q.mod==='right')&&q.type!=='continue'?7:/slight/.test(q.mod)&&q.type==='turn'?13:0;
$('dest').onkeydown=e=>{if(e.key==='Enter')search($('dest').value)};
$('nx').onclick=()=>{NAV=null;if(mapReady)MAP.getSource('route').setData({type:'FeatureCollection',features:[]});navUI()};
addEventListener('online',()=>{loadMap();mapMsg('')});addEventListener('offline',()=>mapMsg('Offline: the speedometer keeps running on GPS only'));
if(navigator.onLine)loadMap();else mapMsg('Offline: the speedometer keeps running on GPS only');
$('bTrip').onclick=()=>{$('trip').showModal();resize()};
addEventListener('resize',resize);units();resize();requestAnimationFrame(loop);
